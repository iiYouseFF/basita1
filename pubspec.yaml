name: basita1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl_phone_field: ^3.2.0
  intl: ^0.18.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2  # لحفظ بيانات المستخدم محلياً
  google_fonts: ^8.2.0
  pinput: ^3.0.1
  camera: ^0.10.5+9
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.5.3
  firebase_core: ^3.15.2      # أو أحدث إصدار
  firebase_auth: ^5.0.0      # أو أحدث إصدار
  cloud_firestore: ^5.6.12    # أو أحدث إصدار
  firebase_storage: ^12.4.10  # أو أحدث إصدار
  supabase_flutter: ^2.8.0
  share_plus: ^13.3.0
  url_launcher: ^6.2.1
  
 
  


  
 
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png" # المسار اللي الصورة فيه
  adaptive_icon_background: "#0F0C29" # نفس لون خلفية تطبيقك
  adaptive_icon_foreground: "assets/icon.png"