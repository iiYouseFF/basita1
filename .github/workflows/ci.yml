name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Pub get
        run: flutter pub get
      - name: Dart format check
        run: dart format --set-exit-if-changed --output=none .
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Check Env & AppConfig compile
        run: dart analyze lib/core/config/env.dart lib/core/config/app_config.dart

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Run tests with coverage
        run: |
          flutter test --coverage --test-randomize-ordering-seed=random
          ls -la coverage/lcov.info || echo "no coverage file"
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "=== lcov line coverage ==="
            lcov --summary coverage/lcov.info 2>&1 | head -n 20 || true
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn


  build-check:
    name: Build check (web & apk debug dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true
      - run: flutter pub get
      - name: Build web (no-pub)
        run: flutter build web --no-pub --dart-define=SUPABASE_URL=https://eczybgjywdppvyyygnrd.supabase.co --dart-define=SUPABASE_ANON_KEY=dummy --dart-define=USE_MOCK_OTP=true
      - name: Build APK debug (no-pub) — smoke
        run: flutter build apk --debug --no-pub --dart-define=SUPABASE_URL=https://eczybgjywdppvyyygnrd.supabase.co --dart-define=SUPABASE_ANON_KEY=dummy --dart-define=USE_MOCK_OTP=true
